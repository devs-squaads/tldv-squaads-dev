name: meeting-db-service

services:
  postgres:
    image: postgres:16
    container_name: meeting-db-service
    env_file:
      - .env
      - ${POSTGRES_ENV_FILE:-.env.production}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:

services:
  meeting-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: meeting-web
    env_file:
      - .env
      - .env.development
    ports:
      - "3000:3000"
    environment:
      ROLE: web
      IS_DOCKER: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  meeting-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: meeting-worker
    env_file:
      - .env
      - .env.development
    environment:
      ROLE: worker
      IS_DOCKER: "true"
    ports:
      - "127.0.0.1:${WORKER_INTERNAL_PORT:-4000}:${WORKER_INTERNAL_PORT:-4000}"
    volumes:
      - .:/app
      - /app/node_modules
      - ./resources:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: meeting-db
    env_file:
      - .env
      - .env.development
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: meeting-storage
    env_file:
      - .env
      - .env.development
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  mc:
    image: minio/mc
    container_name: meeting-storage-mc
    env_file:
      - .env
      - .env.development
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...'
        sleep 1
      done;
      /usr/bin/mc mb local/$${S3_BUCKET} || true;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
